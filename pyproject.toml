[project]
name = "intelligent-doc-classifier"
version = "0.1.0"
description = "Production-grade document classification system using transformer models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zeel Kakadia", email = "zeelkakadia.work@gmail.com"}]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "torch>=2.1",
    "transformers>=4.36",
    "datasets>=2.15",
    "lime>=0.2",
    "optuna>=3.4",
    "mlflow>=2.9",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.5",
    "streamlit>=1.29",
    "evidently>=0.4",
    "plotly>=5.18",
    "pyyaml>=6.0",
    "structlog>=23.2",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "black>=23.11",
    "pre-commit>=3.6",
    "ipykernel>=6.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
